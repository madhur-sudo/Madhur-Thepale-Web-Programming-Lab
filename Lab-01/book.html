<!DOCTYPE html>
<html>
<head>
    <title>Book Information</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Book Information</h1>
    </header>

    <main>

        <div class="book-details">

            <img id="bookImage" src="" alt="Book cover">

            <div class="details-content">

                <h2 id="bookTitle"></h2>

                <p>
                    <strong>Author:</strong>
                    <span id="bookAuthor"></span>
                </p>

                <p>
                    <strong>Genre:</strong>
                    <span id="bookGenre"></span>
                </p>

                <p>
                    <strong>Published:</strong>
                    <span id="bookYear"></span>
                </p>

                <h3>About the Book</h3>

                <p id="bookDescription"></p>

                <a href="index.html" class="back-button">
                    Back to Books
                </a>

            </div>

        </div>

    </main>


    <script>

        const books = {

            piranesi: {
                title: "Piranesi",
                author: "Susanna Clarke",
                genre: "Fantasy / Mystery",
                year: "2020",
                image: "images/piranesi.jpg",
                description:
                    "Piranesi lives in a mysterious House filled with endless halls, statues and an ocean. As he explores the strange world around him, he begins to discover clues that suggest the House may not be what he believes it to be."
            },

            convenience: {
                title: "Convenience Store Woman",
                author: "Sayaka Murata",
                genre: "Contemporary Fiction",
                year: "2016",
                image: "images/convenience.jpg",
                description:
                    "The novel follows Keiko Furukura, a woman who finds comfort and purpose in working at a convenience store. The story explores individuality, social expectations and the pressure to live a conventional life."
            },

            memory: {
                title: "The Memory Police",
                author: "Yoko Ogawa",
                genre: "Dystopian Fiction",
                year: "1994",
                image: "images/memory-police.jpg",
                description:
                    "On an unnamed island, objects begin disappearing and most people slowly forget that they ever existed. A young novelist tries to protect someone who can still remember the things that have been lost."
            },

            longway: {
                title: "The Long Way to a Small, Angry Planet",
                author: "Becky Chambers",
                genre: "Science Fiction",
                year: "2014",
                image: "images/long-way.jpg",
                description:
                    "Rosemary Harper joins the crew of the Wayfarer, a spacecraft travelling through the galaxy. The story follows the crew's adventures while exploring friendship, family and life among different species."
            }

        };


        const params = new URLSearchParams(window.location.search);

        const bookName = params.get("book");

        const book = books[bookName];


        if (book) {

            document.getElementById("bookImage").src = book.image;

            document.getElementById("bookTitle").textContent = book.title;

            document.getElementById("bookAuthor").textContent = book.author;

            document.getElementById("bookGenre").textContent = book.genre;

            document.getElementById("bookYear").textContent = book.year;

            document.getElementById("bookDescription").textContent =
                book.description;

        } else {

            document.getElementById("bookTitle").textContent =
                "Book Not Found";

        }

    </script>

</body>
</html>
