<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Directory</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Google Font: Inter (clean, modern) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <!-- ===================== HEADER ===================== -->
    <header>
        <div class="header-inner">

            <!-- Logo mark icon -->
            <div class="logo-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
            </div>

            <!-- Title text -->
            <div class="header-text">
                <h1>Employee Directory</h1>
                <p>Company workforce overview</p>
            </div>

        </div>
    </header>

    <!-- ===================== MAIN ===================== -->
    <main class="container">

        <!-- Summary bar -->
        <div class="summary-bar">
            <div class="stat-card">
                <div class="stat-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <span>Total Employees</span>
                    <strong id="totalCount">—</strong>
                </div>
            </div>
        </div>

        <!-- Controls: search + result count -->
        <div class="controls">

            <div class="search-wrap">
                <!-- Search icon -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by name, department or designation…"
                    aria-label="Search employees"
                    autocomplete="off"
                />
            </div>

            <span id="resultCount" aria-live="polite"></span>
        </div>

        <!-- Table card -->
        <div class="table-card">
            <div class="table-scroll">
                <table aria-label="Employee Directory">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Name</th>
                            <th scope="col">Department</th>
                            <th scope="col">Designation</th>
                            <th scope="col">Email</th>
                            <th scope="col">Salary</th>
                        </tr>
                    </thead>
                    <tbody id="employeeBody">
                        <!-- Rows are injected by script.js -->
                    </tbody>
                </table>
            </div>

            <!-- Footer note inside the card -->
            <div class="table-footer">
                <span>Data sourced from <code>employees.xml</code></span>
                <span>Lab 9 — Web Programming</span>
            </div>
        </div>

    </main>

    <!-- Load JavaScript after the DOM is ready -->
    <script src="script.js"></script>

</body>
</html>
