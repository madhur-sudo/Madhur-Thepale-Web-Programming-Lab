<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#F5F2EA"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="278" rx="130" ry="14" fill="#242923" opacity="0.12"/>

  <!-- Hub body top face (slight angle) -->
  <rect x="60" y="180" width="280" height="90" rx="12" fill="#344B3B"/>
  <!-- Hub body top surface highlight -->
  <rect x="62" y="182" width="276" height="40" rx="10" fill="#3d5745"/>
  <!-- Hub body bottom/side face -->
  <path d="M60 262 L60 270 Q60 278 72 278 L328 278 Q340 278 340 270 L340 262 Z" fill="#2d3a2f"/>

  <!-- Brand stripe on top -->
  <rect x="62" y="192" width="80" height="3" rx="1.5" fill="#B96F51" opacity="0.7"/>

  <!-- LED indicator -->
  <circle cx="310" cy="194" r="5" fill="#344B3B"/>
  <circle cx="310" cy="194" r="3" fill="#B96F51"/>

  <!-- FRONT FACE ports (bottom of hub in slight perspective) -->
  <!-- USB-A ports (3x) -->
  <g fill="#242923">
    <!-- Port 1: USB-A -->
    <rect x="80" y="234" width="28" height="20" rx="3" fill="#242923"/>
    <rect x="82" y="236" width="24" height="16" rx="2" fill="#1a2219"/>
    <rect x="84" y="238" width="20" height="12" rx="1" fill="#85866B" opacity="0.3"/>
    <rect x="84" y="243" width="20" height="2" rx="1" fill="#85866B" opacity="0.5"/>

    <!-- Port 2: USB-A -->
    <rect x="122" y="234" width="28" height="20" rx="3" fill="#242923"/>
    <rect x="124" y="236" width="24" height="16" rx="2" fill="#1a2219"/>
    <rect x="126" y="238" width="20" height="12" rx="1" fill="#85866B" opacity="0.3"/>
    <rect x="126" y="243" width="20" height="2" rx="1" fill="#85866B" opacity="0.5"/>

    <!-- Port 3: USB-A -->
    <rect x="164" y="234" width="28" height="20" rx="3" fill="#242923"/>
    <rect x="166" y="236" width="24" height="16" rx="2" fill="#1a2219"/>
    <rect x="168" y="238" width="20" height="12" rx="1" fill="#85866B" opacity="0.3"/>
    <rect x="168" y="243" width="20" height="2" rx="1" fill="#85866B" opacity="0.5"/>

    <!-- HDMI port -->
    <rect x="206" y="235" width="34" height="18" rx="3" fill="#242923"/>
    <path d="M209 237 L237 237 L239 251 L207 251 Z" fill="#1a2219"/>
    <rect x="211" y="239" width="22" height="10" rx="1" fill="#85866B" opacity="0.2"/>

    <!-- USB-C port -->
    <rect x="254" y="237" width="22" height="16" rx="8" fill="#242923"/>
    <rect x="256" y="239" width="18" height="12" rx="6" fill="#1a2219"/>
    <rect x="258" y="241" width="14" height="8" rx="4" fill="#85866B" opacity="0.3"/>

    <!-- MicroSD slot -->
    <rect x="289" y="240" width="30" height="10" rx="2" fill="#242923"/>
    <rect x="291" y="242" width="26" height="6" rx="1" fill="#1a2219"/>
  </g>

  <!-- Port labels (tiny) -->
  <g fill="#85866B" font-size="7" font-family="monospace" opacity="0.8">
    <text x="88" y="232">USB 3.0</text>
    <text x="130" y="232">USB 3.0</text>
    <text x="172" y="232">USB 3.0</text>
    <text x="213" y="232">HDMI</text>
    <text x="258" y="232">USB-C</text>
    <text x="291" y="232">SD</text>
  </g>

  <!-- USB-C cable on left end -->
  <rect x="30" y="218" width="32" height="14" rx="7" fill="#242923"/>
  <rect x="32" y="220" width="28" height="10" rx="5" fill="#344B3B"/>
  <!-- Cable -->
  <path d="M14 225 Q8 225 8 220 Q8 150 50 140 Q80 134 80 160" stroke="#242923" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M14 225 Q8 225 8 220 Q8 150 50 140 Q80 134 80 160" stroke="#344B3B" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cable end connector -->
  <rect x="26" y="216" width="20" height="18" rx="4" fill="#85866B"/>
  <rect x="28" y="218" width="16" height="14" rx="3" fill="#242923"/>
  <rect x="30" y="221" width="12" height="8" rx="4" fill="#85866B" opacity="0.4"/>
</svg>
