<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#F5F2EA"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="308" rx="90" ry="14" fill="#242923" opacity="0.13"/>

  <!-- Speaker cylinder body - slight 3/4 view -->
  <!-- Back face -->
  <ellipse cx="210" cy="210" rx="80" ry="100" fill="#2d3a2f"/>
  <!-- Main body -->
  <rect x="130" y="110" width="160" height="200" rx="40" fill="#344B3B"/>
  <!-- Front face ellipse -->
  <ellipse cx="200" cy="210" rx="80" ry="100" fill="#344B3B"/>

  <!-- Fabric mesh texture lines (horizontal) -->
  <g stroke="#242923" stroke-width="1" opacity="0.25">
    <line x1="122" y1="130" x2="278" y2="130"/>
    <line x1="120" y1="142" x2="280" y2="142"/>
    <line x1="120" y1="154" x2="280" y2="154"/>
    <line x1="120" y1="166" x2="280" y2="166"/>
    <line x1="120" y1="178" x2="280" y2="178"/>
    <line x1="120" y1="190" x2="280" y2="190"/>
    <line x1="120" y1="202" x2="280" y2="202"/>
    <line x1="120" y1="214" x2="280" y2="214"/>
    <line x1="120" y1="226" x2="280" y2="226"/>
    <line x1="120" y1="238" x2="280" y2="238"/>
    <line x1="120" y1="250" x2="280" y2="250"/>
    <line x1="120" y1="262" x2="280" y2="262"/>
    <line x1="120" y1="274" x2="280" y2="274"/>
    <line x1="122" y1="286" x2="278" y2="286"/>
  </g>

  <!-- Clip mask ellipse for fabric lines -->
  <ellipse cx="200" cy="210" rx="80" ry="100" fill="#344B3B" opacity="0"/>

  <!-- Speaker grille center circle -->
  <circle cx="200" cy="210" r="52" fill="#2d3a2f"/>
  <circle cx="200" cy="210" r="48" fill="#242923"/>
  <!-- Speaker cone rings -->
  <circle cx="200" cy="210" r="42" fill="none" stroke="#344B3B" stroke-width="3"/>
  <circle cx="200" cy="210" r="32" fill="none" stroke="#344B3B" stroke-width="2.5"/>
  <circle cx="200" cy="210" r="20" fill="none" stroke="#344B3B" stroke-width="2"/>
  <!-- Speaker center -->
  <circle cx="200" cy="210" r="10" fill="#344B3B"/>
  <circle cx="200" cy="210" r="5" fill="#B96F51"/>

  <!-- Volume / power buttons on right side (3/4 view) -->
  <g fill="#242923">
    <circle cx="278" cy="185" r="8" fill="#85866B"/>
    <circle cx="278" cy="185" r="5" fill="#242923"/>
    <!-- Plus symbol -->
    <line x1="275" y1="185" x2="281" y2="185" stroke="#F5F2EA" stroke-width="1.5"/>
    <line x1="278" y1="182" x2="278" y2="188" stroke="#F5F2EA" stroke-width="1.5"/>

    <circle cx="278" cy="210" r="8" fill="#85866B"/>
    <circle cx="278" cy="210" r="5" fill="#242923"/>
    <!-- Minus symbol -->
    <line x1="275" y1="210" x2="281" y2="210" stroke="#F5F2EA" stroke-width="1.5"/>

    <!-- Power button -->
    <circle cx="278" cy="235" r="8" fill="#B96F51"/>
    <circle cx="278" cy="235" r="5" fill="#242923"/>
    <path d="M278 231 L278 235" stroke="#F5F2EA" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M275 232 A4 4 0 1 0 281 232" stroke="#F5F2EA" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- LED indicator strip -->
  <rect x="175" y="118" width="50" height="5" rx="2.5" fill="#344B3B"/>
  <circle cx="192" cy="120" r="2.5" fill="#B96F51"/>
  <circle cx="200" cy="120" r="2.5" fill="#85866B" opacity="0.4"/>
  <circle cx="208" cy="120" r="2.5" fill="#85866B" opacity="0.4"/>

  <!-- Bottom rubber strip -->
  <rect x="136" y="300" width="128" height="8" rx="4" fill="#242923"/>
  <rect x="138" y="302" width="124" height="4" rx="2" fill="#1a2219"/>
</svg>
