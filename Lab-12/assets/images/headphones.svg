<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#F5F2EA"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="348" rx="100" ry="12" fill="#242923" opacity="0.12"/>

  <!-- === HEADBAND === -->
  <!-- Headband outer arc -->
  <path d="M100 200 Q100 60 200 60 Q300 60 300 200" stroke="#242923" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Headband inner highlight -->
  <path d="M100 200 Q100 65 200 65 Q300 65 300 200" stroke="#344B3B" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Headband center top - padded section -->
  <path d="M148 85 Q200 72 252 85" stroke="#85866B" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M150 85 Q200 74 250 85" stroke="#B96F51" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- === LEFT EAR CUP === -->
  <g transform="translate(100, 220)">
    <!-- Cup shadow/depth -->
    <circle cx="0" cy="0" r="58" fill="#1a2219" opacity="0.3"/>
    <!-- Outer cup housing -->
    <circle cx="0" cy="0" r="56" fill="#242923"/>
    <!-- Cup body -->
    <circle cx="0" cy="0" r="52" fill="#344B3B"/>
    <!-- Inner ring (earcup face) -->
    <circle cx="0" cy="0" r="38" fill="#2d3a2f"/>
    <!-- Ear pad ring -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="#85866B" stroke-width="8" opacity="0.4"/>
    <!-- Driver cover mesh -->
    <circle cx="0" cy="0" r="30" fill="#242923"/>
    <circle cx="0" cy="0" r="28" fill="#1a2219"/>
    <!-- Mesh dots -->
    <g fill="#344B3B" opacity="0.6">
      <circle cx="0" cy="-18" r="2.5"/>
      <circle cx="10" cy="-15" r="2.5"/>
      <circle cx="-10" cy="-15" r="2.5"/>
      <circle cx="17" cy="-7" r="2.5"/>
      <circle cx="-17" cy="-7" r="2.5"/>
      <circle cx="20" cy="4" r="2.5"/>
      <circle cx="-20" cy="4" r="2.5"/>
      <circle cx="17" cy="15" r="2.5"/>
      <circle cx="-17" cy="15" r="2.5"/>
      <circle cx="10" cy="21" r="2.5"/>
      <circle cx="-10" cy="21" r="2.5"/>
      <circle cx="0" cy="22" r="2.5"/>
    </g>
    <!-- Center logo -->
    <circle cx="0" cy="0" r="10" fill="#344B3B"/>
    <circle cx="0" cy="0" r="6" fill="#B96F51"/>
  </g>

  <!-- === RIGHT EAR CUP === -->
  <g transform="translate(300, 220)">
    <circle cx="0" cy="0" r="58" fill="#1a2219" opacity="0.3"/>
    <circle cx="0" cy="0" r="56" fill="#242923"/>
    <circle cx="0" cy="0" r="52" fill="#344B3B"/>
    <circle cx="0" cy="0" r="38" fill="#2d3a2f"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#85866B" stroke-width="8" opacity="0.4"/>
    <circle cx="0" cy="0" r="30" fill="#242923"/>
    <circle cx="0" cy="0" r="28" fill="#1a2219"/>
    <g fill="#344B3B" opacity="0.6">
      <circle cx="0" cy="-18" r="2.5"/>
      <circle cx="10" cy="-15" r="2.5"/>
      <circle cx="-10" cy="-15" r="2.5"/>
      <circle cx="17" cy="-7" r="2.5"/>
      <circle cx="-17" cy="-7" r="2.5"/>
      <circle cx="20" cy="4" r="2.5"/>
      <circle cx="-20" cy="4" r="2.5"/>
      <circle cx="17" cy="15" r="2.5"/>
      <circle cx="-17" cy="15" r="2.5"/>
      <circle cx="10" cy="21" r="2.5"/>
      <circle cx="-10" cy="21" r="2.5"/>
      <circle cx="0" cy="22" r="2.5"/>
    </g>
    <circle cx="0" cy="0" r="10" fill="#344B3B"/>
    <circle cx="0" cy="0" r="6" fill="#B96F51"/>
    <!-- Volume wheel on right cup -->
    <rect x="45" y="-14" width="12" height="28" rx="6" fill="#85866B"/>
    <rect x="47" y="-12" width="8" height="24" rx="4" fill="#344B3B"/>
    <line x1="47" y1="-5" x2="55" y2="-5" stroke="#85866B" stroke-width="1.5" opacity="0.7"/>
    <line x1="47" y1="0" x2="55" y2="0" stroke="#85866B" stroke-width="1.5" opacity="0.7"/>
    <line x1="47" y1="5" x2="55" y2="5" stroke="#85866B" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Left yoke adjustment slider -->
  <rect x="82" y="186" width="20" height="40" rx="4" fill="#242923"/>
  <rect x="84" y="188" width="16" height="36" rx="3" fill="#344B3B"/>
  <rect x="86" y="200" width="12" height="10" rx="2" fill="#85866B" opacity="0.5"/>

  <!-- Right yoke adjustment slider -->
  <rect x="298" y="186" width="20" height="40" rx="4" fill="#242923"/>
  <rect x="300" y="188" width="16" height="36" rx="3" fill="#344B3B"/>
  <rect x="302" y="200" width="12" height="10" rx="2" fill="#85866B" opacity="0.5"/>

  <!-- 3.5mm cable -->
  <path d="M100 265 Q75 290 75 330 Q75 345 88 345" stroke="#242923" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M88 340" stroke="#344B3B" stroke-width="3" fill="none"/>
  <!-- 3.5mm plug -->
  <rect x="82" y="340" width="22" height="8" rx="4" fill="#242923"/>
  <circle cx="82" cy="344" r="4" fill="#85866B"/>
</svg>
