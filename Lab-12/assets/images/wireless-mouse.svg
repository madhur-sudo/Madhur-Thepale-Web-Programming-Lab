<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#F5F2EA"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="295" rx="90" ry="18" fill="#242923" opacity="0.12"/>

  <!-- Mouse body - smooth ergonomic oval -->
  <ellipse cx="195" cy="210" rx="72" ry="95" fill="#344B3B"/>
  <!-- Mouse body highlight top -->
  <ellipse cx="195" cy="175" rx="55" ry="58" fill="#3d5745"/>

  <!-- Center split line -->
  <line x1="195" y1="130" x2="195" y2="250" stroke="#242923" stroke-width="2" stroke-linecap="round"/>

  <!-- Left button -->
  <path d="M125 160 Q125 130 160 128 L193 128 L193 185 Q155 185 125 170 Z" fill="#85866B" opacity="0.5"/>
  <!-- Right button -->
  <path d="M265 160 Q265 130 230 128 L197 128 L197 185 Q235 185 265 170 Z" fill="#344B3B" opacity="0.4"/>

  <!-- Scroll wheel -->
  <rect x="187" y="148" width="16" height="30" rx="8" fill="#242923"/>
  <rect x="188" y="150" width="14" height="28" rx="7" fill="#B96F51"/>
  <!-- Scroll wheel ridges -->
  <line x1="188" y1="157" x2="202" y2="157" stroke="#242923" stroke-width="1.5" opacity="0.6"/>
  <line x1="188" y1="162" x2="202" y2="162" stroke="#242923" stroke-width="1.5" opacity="0.6"/>
  <line x1="188" y1="167" x2="202" y2="167" stroke="#242923" stroke-width="1.5" opacity="0.6"/>
  <line x1="188" y1="172" x2="202" y2="172" stroke="#242923" stroke-width="1.5" opacity="0.6"/>

  <!-- Side contour highlight -->
  <path d="M124 185 Q118 220 128 255" stroke="#F5F2EA" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Bottom of mouse -->
  <ellipse cx="195" cy="275" rx="68" ry="20" fill="#242923" opacity="0.15"/>
  <ellipse cx="195" cy="270" rx="66" ry="18" fill="#2d3a2f"/>

  <!-- USB receiver dongle -->
  <g transform="translate(295, 230)">
    <!-- Shadow -->
    <ellipse cx="0" cy="30" rx="22" ry="6" fill="#242923" opacity="0.1"/>
    <!-- Receiver body -->
    <rect x="-10" y="0" width="22" height="40" rx="5" fill="#242923"/>
    <rect x="-8" y="2" width="18" height="36" rx="4" fill="#344B3B"/>
    <!-- LED dot -->
    <circle cx="1" cy="38" r="3" fill="#B96F51"/>
    <!-- USB plug top -->
    <rect x="-5" y="-10" width="12" height="12" rx="2" fill="#85866B"/>
    <rect x="-3" y="-8" width="8" height="8" rx="1" fill="#242923"/>
  </g>

  <!-- Mouse label text area -->
  <rect x="165" y="225" width="60" height="8" rx="2" fill="#242923" opacity="0.1"/>
</svg>
