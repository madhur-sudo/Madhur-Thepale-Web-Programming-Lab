<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#F5F2EA"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="332" rx="130" ry="14" fill="#242923" opacity="0.12"/>

  <!-- Sleeve body -->
  <rect x="68" y="88" width="264" height="234" rx="12" fill="#344B3B"/>
  <!-- Sleeve front face -->
  <rect x="70" y="90" width="260" height="230" rx="10" fill="#344B3B"/>

  <!-- Sleeve texture - subtle weave lines -->
  <g stroke="#2d3a2f" stroke-width="1" opacity="0.4">
    <line x1="70" y1="106" x2="330" y2="106"/>
    <line x1="70" y1="122" x2="330" y2="122"/>
    <line x1="70" y1="138" x2="330" y2="138"/>
    <line x1="70" y1="154" x2="330" y2="154"/>
    <line x1="70" y1="170" x2="330" y2="170"/>
    <line x1="70" y1="186" x2="330" y2="186"/>
    <line x1="70" y1="202" x2="330" y2="202"/>
    <line x1="70" y1="218" x2="330" y2="218"/>
    <line x1="70" y1="234" x2="330" y2="234"/>
    <line x1="70" y1="250" x2="330" y2="250"/>
    <line x1="70" y1="266" x2="330" y2="266"/>
    <line x1="70" y1="282" x2="330" y2="282"/>
    <line x1="70" y1="298" x2="330" y2="298"/>
  </g>

  <!-- === ZIPPER === -->
  <!-- Zipper track (top edge) -->
  <rect x="70" y="88" width="260" height="6" rx="3" fill="#242923"/>
  <rect x="72" y="89" width="256" height="4" rx="2" fill="#85866B"/>

  <!-- Zipper teeth -->
  <g fill="#242923" opacity="0.8">
    <rect x="78" y="89" width="3" height="4" rx="1"/>
    <rect x="88" y="89" width="3" height="4" rx="1"/>
    <rect x="98" y="89" width="3" height="4" rx="1"/>
    <rect x="108" y="89" width="3" height="4" rx="1"/>
    <rect x="118" y="89" width="3" height="4" rx="1"/>
    <rect x="128" y="89" width="3" height="4" rx="1"/>
    <rect x="138" y="89" width="3" height="4" rx="1"/>
    <rect x="148" y="89" width="3" height="4" rx="1"/>
    <rect x="158" y="89" width="3" height="4" rx="1"/>
    <rect x="168" y="89" width="3" height="4" rx="1"/>
    <rect x="178" y="89" width="3" height="4" rx="1"/>
    <rect x="188" y="89" width="3" height="4" rx="1"/>
    <rect x="198" y="89" width="3" height="4" rx="1"/>
    <rect x="208" y="89" width="3" height="4" rx="1"/>
    <rect x="218" y="89" width="3" height="4" rx="1"/>
    <rect x="228" y="89" width="3" height="4" rx="1"/>
    <rect x="238" y="89" width="3" height="4" rx="1"/>
    <rect x="248" y="89" width="3" height="4" rx="1"/>
    <rect x="258" y="89" width="3" height="4" rx="1"/>
    <rect x="268" y="89" width="3" height="4" rx="1"/>
    <rect x="278" y="89" width="3" height="4" rx="1"/>
    <rect x="288" y="89" width="3" height="4" rx="1"/>
    <rect x="298" y="89" width="3" height="4" rx="1"/>
    <rect x="308" y="89" width="3" height="4" rx="1"/>
    <rect x="318" y="89" width="3" height="4" rx="1"/>
  </g>

  <!-- Zipper pull (positioned at ~1/4 from right) -->
  <rect x="275" y="84" width="22" height="14" rx="3" fill="#85866B"/>
  <rect x="277" y="86" width="18" height="10" rx="2" fill="#B96F51"/>
  <rect x="281" y="88" width="10" height="6" rx="1" fill="#242923" opacity="0.3"/>
  <!-- Pull tab -->
  <rect x="282" y="97" width="6" height="12" rx="2" fill="#85866B"/>
  <rect x="283" y="99" width="4" height="10" rx="1.5" fill="#344B3B"/>
  <circle cx="285" cy="109" r="3" fill="#85866B"/>
  <circle cx="285" cy="109" r="1.5" fill="#242923"/>

  <!-- Brand patch / label -->
  <rect x="148" y="260" width="104" height="38" rx="4" fill="#2d3a2f"/>
  <rect x="150" y="262" width="100" height="34" rx="3" fill="#242923"/>
  <text x="200" y="276" font-family="Georgia, serif" font-size="10" fill="#F5F2EA" text-anchor="middle" font-weight="bold">MORROW</text>
  <text x="200" y="290" font-family="Georgia, serif" font-size="7" fill="#85866B" text-anchor="middle">SUPPLY</text>

  <!-- Bottom rubber accent stripe -->
  <rect x="70" y="308" width="260" height="10" rx="5" fill="#B96F51" opacity="0.6"/>
  <rect x="70" y="310" width="260" height="6" rx="3" fill="#242923" opacity="0.2"/>

  <!-- Left handle loop -->
  <path d="M120 90 Q110 70 120 60 Q128 54 136 60 Q140 65 136 75" stroke="#85866B" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M120 90 Q110 70 120 60 Q128 54 136 60 Q140 65 136 75" stroke="#B96F51" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Side piping details -->
  <rect x="68" y="92" width="4" height="224" rx="2" fill="#85866B" opacity="0.5"/>
  <rect x="328" y="92" width="4" height="224" rx="2" fill="#85866B" opacity="0.5"/>
</svg>
