<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Quiet Library, a curated collection of unusual stories.">
  <title>The Quiet Library | Book Information</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
  <header class="site-header">
    <p class="eyebrow">Independent reading room</p>
    <div>
      <h1>The Quiet Library</h1>
      <p>A small collection of unusual stories.</p>
    </div>
    <span class="header-mark" aria-hidden="true">QL</span>
  </header>

  <main class="library-shell" aria-label="Book information library">
    <aside class="frame-panel catalogue-panel" aria-label="Book list frame">
      <iframe src="books.html" title="Book collection" name="bookList"></iframe>
    </aside>
    <section class="frame-panel information-panel" aria-label="Book information frame">
      <iframe src="welcome.html" title="Selected book information" name="bookInfo"></iframe>
    </section>
  </main>

  <footer>Web Programming Lab 3 &middot; Frame-based book information website</footer>
</body>
</html>
